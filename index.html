<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Login Page</title>
</head>
<body>
    <div class="container">
        <div class="left"><img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkQKve1KsekV7SIb72UHdsTCwR-MkkwsAF3mMuGJatr7NWTR3nHVIP3JE&s=10"
          alt=""
        /></div>
        <div class="right">
            <div class="heading">
                <h1>Hello Again!</h1>
                <p>Welcome back! we missed you!</p>
            </div>
            <div class="form">
                <form action="">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="EmailId@site.com" required>

                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Password" required>


                    <a href="#">Forgot Password</a>
                    <button type="submit">Login</button>

                    <p>Not a member? <a href="#">Register Now</a></p>
                </form>
            </div>
        </div>
    </div>
    
</body>
</html>
