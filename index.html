<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="left">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkQKve1KsekV7SIb72UHdsTCwR-MkkwsAF3mMuGJatr7NWTR3nHVIP3JE&s=10"
          alt=""
        />
      </div>
      <div class="right">
        <div class="heading">
          <h1>Hello Again!</h1>
          <p>Welcome back! we missed you!</p>
        </div>
        <div class="form">
          <form action="">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="EmailId@site.com"
              required
            title="Please enter a valid email address"
            />

            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Password"
              minlength="8"
              title="Password must contain at least 8 characters, one uppercase letter, one lowercase letter, and one number."
              required
            />

            <a href="#" id="forgot-password">Forgot Password</a>
            <button type="submit">Login</button>

            <p>Not a member? <a href="#">Register Now</a></p>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
